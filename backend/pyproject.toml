[project]
name = "multimodal-presenter-backend"
version = "0.1.0"
description = "Backend del transformador de información multimodal (trabajo de grado — Univalle)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "logfire[fastapi]>=3.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.46.0",
    "filetype>=1.2.0",
    "python-multipart>=0.0.32",
    "truststore>=0.10.4",
    "httpx>=0.28.1",
    "mutagen>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "fpdf2>=2.8.8",
    "pypdf>=6.19.0",
    "matplotlib>=3.11.2",
]
experiments = [
    "lightrag-hku>=1.5.7",
    "pypdfium2>=5.13.0",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_presenter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Por defecto NO corre los tests de integración (API real). Para correrlos: pytest -m integration
addopts = "-q -m 'not integration'"
markers = [
    "integration: test que llama al modelo real (Anthropic claude-sonnet-5); solo local, saltado sin clave.",
]
# Silencia SOLO deprecaciones internas de starlette/fastapi/anyio (su TestClient).
# No son de nuestro código y se resolverán al actualizar esas dependencias.
# Se filtran por mensaje específico para no ocultar warnings propios en el futuro.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:Warning",
]
